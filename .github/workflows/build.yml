name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # VideoLAN only publishes libdvdcss as source, so compile libdvdcss-2.dll with MSYS2/MinGW.
      # build.bat then finds it in the folder and embeds it in the exe.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Build libdvdcss-2.dll from source
        shell: msys2 {0}
        run: bash get_libdvdcss.sh
      # build.bat downloads HandBrakeCLI 1.11.2 (checksum-verified) if it isn't in the repo,
      # installs PyInstaller + smbprotocol, and builds dist\rip.exe with the Rippy icon.
      - name: Build rip.exe
        shell: cmd
        run: call build.bat
      - name: Read version from rip.py
        id: ver
        shell: bash
        run: |
          V=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' rip.py | head -n 1)
          # an MSI version has to be plain numbers, like 1.2.3
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "VERSION in rip.py must look like 1.2.3, got '$V'"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # The installer is a per-user MSI (no admin prompt, so the in-app "Install update" button can run it silently).
      # The portable build is just the same exe, renamed.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Rippy.msi and Rippy-portable.exe
        shell: bash
        run: |
          mkdir out
          cp dist/rip.exe out/Rippy-portable.exe
          wix build installer/Rippy.wxs -arch x64 \
            -d Version=${{ steps.ver.outputs.version }} \
            -d ExePath=dist/rip.exe -d IconPath=rippy.ico -d FlagPath=installer/installed.flag \
            -o out/Rippy.msi
      - name: Test built-in settings (copy the exe with settings inside, run it on a "fresh PC")
        shell: pwsh
        run: |
          $real = $env:APPDATA
          $a = Join-Path $PWD 'appdata-a'; $b = Join-Path $PWD 'appdata-b'
          New-Item -ItemType Directory -Force "$a\Rippy", $b | Out-Null
          '{"tmdb_api_key": "ci-test-key"}' | Set-Content "$a\Rippy\settings.json" -Encoding utf8
          $env:APPDATA = $a
          $p = Start-Process "$PWD\out\Rippy-portable.exe" -ArgumentList '--export-portable', "$PWD\copy.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path copy.exe)) { throw "export-portable failed" }
          $env:APPDATA = $b                      # a PC with no settings of its own
          $p = Start-Process "$PWD\copy.exe" -ArgumentList '--dump-embedded', "$PWD\dump.json" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path dump.json)) { throw "the exe with built-in settings didn't start" }
          if ((Get-Content dump.json -Raw) -notmatch 'ci-test-key') { throw "built-in settings were not found: $(Get-Content dump.json -Raw)" }
          $env:APPDATA = $real
      - name: Test the MSI (install, check, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', "$PWD\out\Rippy.msi", '/qn', 'NOLAUNCH=1', '/l*v', "$PWD\msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec install failed with exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Rippy'
          foreach ($f in 'Rippy.exe', 'installed.flag') { if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" } }
          if (-not (Get-ItemProperty 'HKCU:\Software\Rippy').ProductCode) { throw "ProductCode not written to the registry" }
          $p = Start-Process msiexec -ArgumentList '/x', "$PWD\out\Rippy.msi", '/qn', '/l*v', "$PWD\msi-uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec uninstall failed with exit code $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir 'Rippy.exe')) { throw "Rippy.exe still there after uninstall" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: msi-logs
          path: msi-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: rippy-windows
          path: |
            out/Rippy.msi
            out/Rippy-portable.exe
          if-no-files-found: error

  linux:
    # Older Ubuntu on purpose: a binary built against an older glibc runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HandBrakeCLI
        run: sudo apt-get update && sudo apt-get install -y handbrake-cli
      - name: Check tkinter is available
        run: python -c "import tkinter; print('tkinter OK')"
      # build.sh copies HandBrakeCLI from PATH on Linux, then runs PyInstaller.
      - name: Build rip
        run: bash build.sh
      - name: Package (keeps the executable bit)
        run: tar -czf rippy-linux.tar.gz -C dist rip
      - uses: actions/upload-artifact@v4
        with:
          name: rippy-linux
          path: rippy-linux.tar.gz
          if-no-files-found: error

  release:
    # The version lives in one place: VERSION in rip.py. When a push to main/master changes it to a version
    # that has no release yet, this job publishes release v<VERSION> with Rippy.msi, Rippy-portable.exe and the Linux build attached
    # as plain files. Pushes that don't change the version just build (so you still see if the build breaks).
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version from rip.py
        id: ver
        run: |
          V=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' rip.py | head -n 1)
          if [ -z "$V" ]; then echo "Could not find VERSION in rip.py"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version in rip.py: $V"
      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} is already released, nothing to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.released == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          mkdir release
          cp artifacts/rippy-windows/Rippy.msi release/Rippy.msi
          cp artifacts/rippy-windows/Rippy-portable.exe release/Rippy-portable.exe
          cp artifacts/rippy-linux/rippy-linux.tar.gz release/rippy-linux.tar.gz
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Rippy ${TAG#v}" --generate-notes
